  <circle cx="25" cy="30.8" r="1.1" fill="#FFFFFF" />
  <ellipse cx="38" cy="32" rx="2.5" ry="3.5" fill="#1E293B" />
  <circle cx="37" cy="30.8" r="1.1" fill="#FFFFFF" />

