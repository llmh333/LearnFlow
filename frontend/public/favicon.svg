  <ellipse cx="21" cy="37" rx="2.5" ry="1.5" fill="#FF4B4B" fill-opacity="0.5" />
  <ellipse cx="43" cy="37" rx="2.5" ry="1.5" fill="#FF4B4B" fill-opacity="0.5" />

