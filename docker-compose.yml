services:
  # D14 reversed (see plan/phases/00-overview.md decision log): the first prod deploy measured
  # ~300-400ms raw TCP connect latency from the VPS to Supabase's ap-southeast-2 pooler — a
  # networking limitation of the VPS provider's international routing, not fixable in app config —
  # making every DB-touching request feel slow. VPS RAM headroom (only ~300MB used of ~960MB with
  # backend+frontend running) turned out to comfortably fit a local Postgres too, so prod now
  # self-hosts it again, same as the original plan, eliminating the network hop entirely.
  # Runs under both profiles now; local dev still starts it with `docker compose --profile dev up -d postgres`.
  postgres:
    profiles: ["dev", "prod"]
    image: postgres:17-alpine
    container_name: learnflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - learnflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnflow} -d ${POSTGRES_DB:-learnflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production (D15, minus Supabase per the note above): 3 containers total on the VPS, backend
  # never publishes a port directly — frontend's Caddy is the only thing exposed, reverse-proxying
  # /api/* to backend.
  backend:
    profiles: ["prod"]
    image: ghcr.io/${GHCR_OWNER:-llmh333}/learnflow-backend:latest
    container_name: learnflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learnflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-learnflow}
      # Spring relaxed binding needs the full property-path env var name under the prod profile
      # (application-local.yml has an explicit ${JWT_SECRET} placeholder, application-prod.yml does not).
      APP_AUTH_JWT_SECRET: ${JWT_SECRET}
      # AI provider is swappable without a redeploy: set AI_PROVIDER=gemini + GEMINI_API_KEY in
      # .env to switch, no code change needed (see backend ai.provider.GeminiAIProvider).
      APP_AI_PROVIDER: ${AI_PROVIDER:-claude}
      APP_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APP_AI_GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      # application-prod.yml hardcodes registration-enabled=false (register once, then lock down),
      # but that leaves no way to ever create the first account. Default stays false/locked; flip
      # REGISTRATION_ENABLED=true in .env for the one-time initial registration, then set it back.
      APP_AUTH_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    expose:
      - "8080"

  frontend:
    profiles: ["prod"]
    image: ghcr.io/${GHCR_OWNER:-llmh333}/learnflow-frontend:latest
    container_name: learnflow-frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  learnflow-pgdata:
    name: learnflow-pgdata
  caddy_data:
    name: learnflow-caddy-data
  caddy_config:
    name: learnflow-caddy-config
