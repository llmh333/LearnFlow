app:
  auth:
    jwt-secret: test-secret-not-for-production-use-at-least-32-bytes-long
  vocabulary:
    # Off by default: most integration tests register a fresh account and hand-compute exact
    # vocabulary/progress counts, which the 300-word starter pack would otherwise break for all of
    # them. ExerciseIntegrationTest turns this back on for just that one test class, since it needs
    # real seeded words (with example sentences) to exercise deterministic generation end-to-end.
    seed-starter-pack-on-register: false
  ai:
    anthropic-api-key: ""
