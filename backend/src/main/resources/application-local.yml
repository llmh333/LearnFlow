spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:learnflow}
    username: ${POSTGRES_USER:learnflow}
    password: ${POSTGRES_PASSWORD:learnflow}

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
  ai:
    provider: ${AI_PROVIDER:claude}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    groq-api-key: ${GROQ_API_KEY:}
