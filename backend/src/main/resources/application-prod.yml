# Production profile (Phase 8, D15; D17 revert): tuned for a 1 vCPU / 1GB RAM VPS, self-hosting
# Postgres alongside the app (see D17 — Supabase was tried first per D14, then reverted due to
# high network latency from the VPS). Activated via SPRING_PROFILES_ACTIVE=prod in docker-compose.yml.
spring:
  datasource:
    hikari:
      # Single-user app — the default pool of 10 is pure overhead on a tiny VPS.
      maximum-pool-size: 3

server:
  tomcat:
    threads:
      max: 10

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
  ai:
    provider: ${AI_PROVIDER:claude}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    groq-api-key: ${GROQ_API_KEY:}
# app.auth.registration-enabled has no override here on purpose: docker-compose.yml always sets
# APP_AUTH_REGISTRATION_ENABLED (env vars beat profile yml), so that's the single source of truth
# for prod — keeping a value here too would just be dead config nobody notices going stale.
