# Production profile (Phase 8, D15; D17 revert): tuned for a 1 vCPU / 1GB RAM VPS, self-hosting
# Postgres alongside the app (see D17 — Supabase was tried first per D14, then reverted due to
# high network latency from the VPS). Activated via SPRING_PROFILES_ACTIVE=prod in docker-compose.yml.
spring:
  datasource:
    hikari:
      # Single-user app — the default pool of 10 is pure overhead on a tiny VPS.
      maximum-pool-size: 3

  # No default host: startup fails without SMTP, so reset codes are never only logged in prod.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  # Caddy sends X-Forwarded-For; Tomcat trusts private-network proxies by default, so
  # request.getRemoteAddr() becomes the real client IP (login rate limit keys on it).
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 10

app:
  auth:
    # No default: startup fails without a real secret (AuthProperties validates length >= 32).
    jwt-secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM}
  ai:
    provider: ${AI_PROVIDER:claude}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    groq-api-key: ${GROQ_API_KEY:}
# app.auth.registration-enabled has no override here on purpose: docker-compose.yml always sets
# APP_AUTH_REGISTRATION_ENABLED (env vars beat profile yml), so that's the single source of truth
# for prod — keeping a value here too would just be dead config nobody notices going stale.
